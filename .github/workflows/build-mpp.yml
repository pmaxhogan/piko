name: Build MPP

# Builds the piko .mpp WITH the Vantage-only patches ("Hide verified users",
# "Daily time limit") and publishes it as a GitHub release asset that
# pmaxhogan/vantage consumes (build-x.sh floats to this repo's latest release).
# Runs on ubuntu (Android SDK preinstalled). No GPG/semantic-release needed.
#
# VERSIONING: gradle.properties is kept byte-identical to upstream crimera/piko
# so the nightly sync-upstream PR never conflicts on the version line. The
# Vantage suffix is applied HERE at build time as
# "<upstream-version>-vantage.<VANTAGE_REV>" - used for the release tag / asset
# name and passed to Gradle via -Pversion so the built .mpp carries it too. Bump
# VANTAGE_REV for a Vantage-only rebuild on the same upstream version (an
# upstream bump already yields a fresh tag on its own).
#
# PRERELEASE GATE: the repository variable MPP_PRERELEASE ("true"/"false")
# decides whether the release is marked prerelease. vantage's build-x.sh reads
# /releases/latest, which skips prereleases, so while the variable is "true" a
# new .mpp never reaches the Vantage X nightly. Use it to stage a fork change
# that vantage's build scripts are not ready for yet.

on:
  push:
    branches: [main]
    paths:
      - 'extensions/**'
      - 'patches/**'
      - 'gradle/**'
      - 'gradle.properties'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/build-mpp.yml'
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Mark the release as prerelease (overrides the MPP_PRERELEASE variable)"
        type: choice
        options: ["auto", "true", "false"]
        default: "auto"

concurrency:
  group: build-mpp
  cancel-in-progress: false

permissions:
  contents: write

env:
  # Vantage build revision. See the VERSIONING note above.
  VANTAGE_REV: "1"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compute Vantage version
        run: |
          set -euo pipefail
          BASE="$(grep -E '^version *= *' gradle.properties | sed -E 's/^version *= *//' | tr -d '[:space:]')"
          [ -n "$BASE" ] || { echo "::error::no version in gradle.properties"; exit 1; }
          VVER="${BASE}-vantage.${VANTAGE_REV}"
          echo "VVER=$VVER" >> "$GITHUB_ENV"
          echo "Building Vantage version $VVER (upstream base $BASE, rev $VANTAGE_REV)"

      - name: Run extension unit tests
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew :extensions:twitter:testReleaseUnitTest --no-daemon --console=plain

      - name: Build the .mpp
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :patches:buildAndroid --no-daemon --console=plain -Pversion="$VVER"

      - name: Publish .mpp release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRERELEASE_INPUT: ${{ github.event.inputs.prerelease || 'auto' }}
          PRERELEASE_VAR: ${{ vars.MPP_PRERELEASE || 'false' }}
        run: |
          set -euo pipefail
          MPP="$(ls patches/build/libs/patches-*.mpp | grep -viE 'sources|javadoc' | head -1)"
          [ -n "$MPP" ] || { echo "::error::no .mpp produced"; exit 1; }
          TAG="v${VVER}"
          ASSET="patches-${VVER}.mpp"
          cp "$MPP" "$ASSET"
          PRE="$PRERELEASE_VAR"; [ "$PRERELEASE_INPUT" != "auto" ] && PRE="$PRERELEASE_INPUT"
          PREFLAG="--prerelease=false"; [ "$PRE" = "true" ] && PREFLAG="--prerelease"
          echo "built $ASSET (from $MPP), tag $TAG, prerelease=$PRE"
          NOTES="piko patches $VVER built from crimera/piko $(git rev-parse --short HEAD) plus the Vantage-only patches (Hide verified users, Daily time limit). Consumed by pmaxhogan/vantage build-x.sh. Built $(date -u +%Y-%m-%dT%H:%M:%SZ)."
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists - updating asset in place"
            gh release upload "$TAG" "$ASSET" --clobber
            gh release edit "$TAG" --notes "$NOTES" $PREFLAG
          else
            gh release create "$TAG" "$ASSET" --title "$TAG" --notes "$NOTES" $PREFLAG
          fi
